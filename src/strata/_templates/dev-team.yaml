# Strata fleet configuration — development team template
#
# This file is the source of truth for fleet shape: strata, scopes, and edges.
# Edit it to match your organisation, then run `strata bootstrap` to validate.
#
# Vocabulary (from CONTEXT.md):
#   stratum  — a horizontal layer of scopes (ordinal 0 = broadest)
#   scope    — a bounded region of the fleet; memory attaches here
#   edge     — a directed link between two scopes, of one of two kinds:
#              chain     — binds a scope to its single parent in the stratum
#                          immediately above; carries directives and context
#                          down. Written `kind: chain`, or inferred when the
#                          two scopes sit on adjacent strata. The parent is the
#                          lower-ordinal endpoint whichever way you write it.
#              reference — a weak link to any scope on any stratum; carries
#                          that scope's publication only, never binding.
#                          Written `kind: reference`, or inferred when both
#                          scopes share a stratum (the peer reference). Must be
#                          written out to span two or more strata.
#
# Scope lifecycle:
#   status: active    (default) — accepts contributions, visible to /scopes
#   status: archived  — rejects new contributions; kept for historical provenance
#
# Per-scope skill declarations (consumed by `strata launch`):
#   default_skill: code-writer           # optional — used when launching without --skill
#   permitted_skills: [code-writer, ...]  # optional — restricts valid skill bindings

strata:
  - id: L0
    name: Executive
    ordinal: 0      # broadest stratum; directives here bind the whole fleet

  - id: L1
    name: Function
    ordinal: 1      # functional leads (engineering, product, etc.)

  - id: L2
    name: Team
    ordinal: 2      # individual teams and contributors

scopes:
  # ---- Executive ----
  # Note: `scope-manager` is a reserved identity (the LLM curator of each
  # scope's memory, per CONTEXT.md) — never use it as a worker skill.
  - id: g_ceo
    name: CEO
    stratum_id: L0
    status: active
    default_skill: ceo
    permitted_skills: [ceo]

  # ---- Function ----
  - id: g_eng
    name: Engineering
    stratum_id: L1
    status: active
    default_skill: eng-lead
    permitted_skills: [eng-lead, evidence-summarizer]

  - id: g_arch
    name: Architect
    stratum_id: L1
    status: active
    default_skill: code-writer
    permitted_skills: [code-writer, evidence-summarizer]

  # ---- Team ----
  - id: g_backend
    name: Backend Dev
    stratum_id: L2
    status: active
    default_skill: code-writer
    permitted_skills: [code-writer, evidence-summarizer]

edges:
  # Chain edges (child → single parent; directives + context flow down).
  # Every non-root scope has exactly one chain edge to a parent. The kind is
  # inferred here because the two scopes sit on adjacent strata.
  - from: g_eng       # L1 → L0
    to: g_ceo
  - from: g_arch      # L1 → L0  (Engineering and Architect are peer functions)
    to: g_ceo
  - from: g_backend   # L2 → L1  (Architect is the Backend Dev's single parent,
    to: g_arch        #           so Architect's directives bind Backend Dev)

  # Reference edge on one stratum — the peer reference. Carries Architect's
  # publication to Engineering, never its internal summary and never a
  # directive. Direction means referencer → referenced.
  - from: g_eng       # L1 → L1
    to: g_arch
    kind: reference
